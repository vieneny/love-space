[project]
name = "love-space-api"
version = "0.1.0"
description = "Private couple memories and travel API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "python-multipart>=0.0.20",
  "pillow>=11,<13", "httpx>=0.28,<1", "tzdata>=2025.1"
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
